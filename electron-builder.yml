appId: com.capji.teel
productName: CAPji teel
copyright: CAPJI
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asar: true
# ملفات القوالب وأدوات adb/fastboot تُنسخ بجانب البرنامج (خارج asar) ليسهل تعديلها
extraResources:
  - from: resources/data
    to: data
  - from: resources/tools
    to: tools
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: CAPji-teel-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: CAPji teel
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
portable:
  artifactName: CAPji-teel-Portable-${version}.${ext}
